---
layout: default
---

<style>
  .home-hero {
    background: #082544;
    color: #ffffff;
    padding: 65px 24px 75px;
  }

  .home-hero__inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 55px;
  }

  .home-hero__portrait {
    width: 190px;
    height: 190px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #ffffff;
  }

  .home-hero__content {
    border-left: 1px solid #ffffff;
    padding-left: 40px;
  }

  .home-hero__content h1 {
    color: #ffffff;
    font-family: Georgia, serif;
    font-size: 52px;
    margin: 0 0 12px;
  }

  .home-hero__subtitle {
    color: #f8f6f2;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 22px;
  }

  .home-hero__description {
    color: #ffffff;
    max-width: 660px;
    line-height: 1.65;
  }

  .home-hero__links a {
    color: #ffffff;
    margin-right: 22px;
    text-decoration: none;
  }

  .home-hero__links a:hover {
    color: #f8f6f2;
    text-decoration: underline;
  }

  .home-main {
    background: #ffffff;
    max-width: 1200px;
    margin: 0 auto;
    padding: 45px 24px;
  }

  @media (max-width: 768px) {
    .home-hero__inner {
      flex-direction: column;
      gap: 25px;
      text-align: center;
    }

    .home-hero__content {
      border-left: none;
      padding-left: 0;
    }

    .home-hero__content h1 {
      font-size: 40px;
    }

    .home-hero__portrait {
      width: 150px;
      height: 150px;
    }
  }
  
    .home-hero__links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 24px;
      margin-top: 24px;
    }
    
    .home-hero__links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 0;
      color: #ffffff;
      font-size: 15px;
    }
    
    .home-hero__links i {
      font-size: 17px;
    }
    
    .home-hero__links a:hover {
      color: #f5e8d8;
    }
    
    @media (max-width: 768px) {
      .home-hero__links {
        justify-content: center;
      }
    }
  
    /* Single white wave divider */
    .home-wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      line-height: 0;
      overflow: hidden;
      background: transparent;
      z-index: 2;
      pointer-events: none;
    }
    
    .home-wave svg {
      display: block;
      width: 100%;
      height: 28px;
    }
    
    @media (max-width: 768px) {
      .home-wave svg {
        height: 18px;
      }
    }
      
    /* ====================================
       Tropical Atmospheric Signature
       ==================================== */
    
    .home-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background-color: #082544;
    }
    
    /* Satellite imagery on the right */
    .home-hero::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 48%;
      height: 100%;
    
      background-image: url('/images/real_satellite_clouds_navy_zoom.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    
      /* Fade image edges without changing background colour */
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 35%,
        black 100%
      );
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 35%,
        black 100%
      );
    
      opacity: 0.8;
      z-index: -1;
    }
    
    /* Keep portrait and text above imagery */
    .home-hero__inner {
      position: relative;
      z-index: 1;
    }
    
    /* Hide satellite image on narrow screens */
    @media (max-width: 768px) {
      .home-hero::before {
        display: none;
      }
    }

</style>

<section class="home-hero">
  <div class="home-hero__inner">

    <img
      class="home-hero__portrait"
      src="{{ site.author.avatar | prepend: '/images/' | relative_url }}"
      alt="Chang Xu"
    >

    <div class="home-hero__content">
      <h1>Chang Xu</h1>

      <p class="home-hero__subtitle">
        Tropical Convection · Atmospheric Waves · Moisture Dynamics
      </p>

      <p class="home-hero__description">
        I study tropical atmospheric variability, focusing on
        the physical interactions between convection, moisture
        and large-scale circulation.
      </p>
      
      <div class="home-hero__links">
        <a href="mailto:{{ site.author.email }}">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          Email
        </a>
      
        <a href="{{ site.author.googlescholar }}">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          Google Scholar
        </a>
      
        <a href="{{ site.author.orcid }}">
          <i class="ai ai-orcid" aria-hidden="true"></i>
          ORCID
        </a>
      
        <a href="https://github.com/{{ site.author.github }}">
          <i class="fab fa-github" aria-hidden="true"></i>
          GitHub
        </a>
      
        <a href="{{ site.author.linkedin }}">
          <i class="fab fa-linkedin" aria-hidden="true"></i>
          LinkedIn
        </a>
      </div>

    </div>
  
  </div>

<div class="home-wave" aria-hidden="true">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1440 70"
    preserveAspectRatio="none"
  >
    <path
      d="M0,25
         C180,0 320,70 520,50
         C720,30 800,0 1000,25
         C1200,55 1320,45 1440,20
         L1440,70 L0,70 Z"
      fill="#ffffff"
    />
  </svg>
</div>
</section>

<main class="home-main">
  {{ content }}
</main>
